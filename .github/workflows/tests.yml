name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets publish.yml gate a release on this exact suite instead of
  # duplicating it.
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: environment.yml
          activate-environment: mlmolprop
          miniforge-version: latest

      - name: Run test suite
        shell: bash -el {0}
        run: pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: environment.yml
          activate-environment: mlmolprop
          miniforge-version: latest

      - name: Ruff check
        shell: bash -el {0}
        run: ruff check .

  pip-install-smoke-test:
    # Verifies the package installs from plain PyPI with no conda-forge
    # fallback, and that the base install (no extras) doesn't pull in
    # keras/torch -- catches a floor that only resolves via
    # conda-forge, or a dependency that should be optional but isn't.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: pip install .
        run: pip install .

      - name: Smoke test
        run: python -c "import mlmolprop; print(mlmolprop.__version__)"
