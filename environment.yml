# Reproducible dev environment: conda env create -f environment.yml
name: chemsar
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.5
  - pandas=3.0
  - matplotlib=3.10
  - scikit-learn=1.9
  - scipy=1.18
  - rdkit=2025.09
  - reportlab=5.0
  - svglib=2.1
  - keras=3.15
  - tensorflow=2.18
  - lime=0.2
  # dev tools
  - ruff=0.16
  - black=26.5
  - pytest=9.1
  - notebook=7.6
  - nbconvert=7.17
  - pip
  - pip:
      - -e .
