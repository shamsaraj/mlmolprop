name: publish

# Publishes to PyPI when a GitHub Release is published. Tagging alone does not
# release -- the tag is cut first, then publishing the Release triggers this.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # Gate: the full suite must pass on the released commit before anything is
  # uploaded. Reuses tests.yml rather than duplicating it.
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Validate metadata and README rendering
        run: python -m twine check dist/*

      - name: Fail if the built version does not match the tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's/.*mlmolprop-(.*)\.tar\.gz/\1/')
          echo "tag=$tag built=$built"
          test "$tag" = "$built"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing -- no API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
