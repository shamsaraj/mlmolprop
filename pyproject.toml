[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlmolprop"
version = "1.10.0"
authors = [
  { name="Jamal Shamsara", email="jshamsara@yahoo.com" }
]
description = "Machine learning and cheminformatics toolkit for molecular modeling."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
  "cheminformatics", "qsar", "molecular-descriptors", "fingerprints",
  "rdkit", "machine-learning", "drug-discovery",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  # Lower bounds are proven, not assumed: the pytest-oldest-supported CI job
  # runs the full suite against exactly these versions on every push. They are
  # deliberately well below environment.yml, which is the development
  # environment and tracks current releases. No upper bounds unless a real
  # incompatibility is found, so this doesn't fight other packages'
  # requirements.
  "numpy>=2.0",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "rdkit>=2024.3",
  "reportlab>=5.0",
  "svglib>=2.1",
  "lime>=0.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
# graphviz is imported only inside a try/except in model.py's decision-tree
# visualization path (already treated as optional by the code itself), and
# isn't in environment.yml, so there's no tested version to anchor a lower
# bound to.
viz = ["graphviz"]
# keras is used only by model.py's M="dl" path (lazy-imported there with
# an informative error if missing; nothing else in the package needs
# it). Backed by PyTorch rather than TensorFlow -- TensorFlow's PyPI
# wheels are capped at 2.16.2 on Intel macOS and that build pulls in a
# numpy<2 pin that breaks the rest of this project's dependencies.
# PyTorch has no such conflict, and Keras 3's torch backend is verified
# (see tests/test_model.py::test_modelc_dl_actually_trains) to build,
# train, and predict the same way the tensorflow backend did. Requires
# KERAS_BACKEND=torch to be set -- see README.
dl = ["keras>=3.0", "torch>=2.0"]
# Reserved for a future M="dl_torch" path that uses torch directly, with
# no keras dependency -- unused by any code yet, kept as its own extra
# so that path won't need to pull in keras once it exists.
torch = ["torch>=2.0"]
# xgboost is used only by model.py's M="xgb" path (lazy-imported there via
# _import_xgboost(), with an informative error if missing).
xgboost = ["xgboost>=3.0"]
# rlPyCairo backs reportlab's raster rendering, used only by
# image.py::svg_files_to_png() and molprep.py::RDimage() (both
# lazy-imported, with an informative error if missing). rlPyCairo itself
# ships a pure-Python wheel, but it pulls in pycairo, which publishes
# binary wheels for Windows only -- on macOS and Linux pip must compile it
# against a system Cairo plus pkg-config, which a bare `pip install`
# cannot provide. conda-forge ships a prebuilt binary instead (see
# environment.yml), and that is the recommended path.
image = ["rlPyCairo>=0.4.0"]
# Deliberately excludes "image": `all` must stay installable by pip alone.
# Because pip resolves every extra together, including image here made
# `pip install mlmolprop[all]` fail outright on macOS and Linux without
# system Cairo -- taking dl, torch and xgboost down with it even though
# those install fine. Ask for mlmolprop[image] explicitly if you want it.
all = ["mlmolprop[dl,torch,xgboost]"]

[project.urls]
"Homepage" = "https://github.com/shamsaraj/mlmolprop"
"Bug Tracker" = "https://github.com/shamsaraj/mlmolprop/issues"

[tool.hatch.build.targets.sdist]
# Ship the package, its tests and the quickstart; leave development notes and
# the CI config out of the distribution.
exclude = ["CLAUDE.md", ".github", ".gitignore"]

[tool.hatch.build.targets.wheel]
packages = ["src/mlmolprop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises heavier code paths (e.g. training a Keras model); still run by default, but filterable with `-m \"not slow\"`.",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Tests intentionally unpack full return tuples to document a function's
# return shape at the call site, even when a given test only asserts on
# part of it.
"tests/*" = ["RUF059"]
