[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chemsar"
version = "0.1.0"
authors = [
  { name="Jamal Shamsara", email="jshamsara@yahoo.com" }
]
description = "Machine learning and cheminformatics toolkit for molecular modeling."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "scikit-learn",
  "scipy",
  "rdkit",
  "reportlab",
  "svglib",
  "keras",
  "tensorflow",
  "lime",
]

[project.urls]
"Homepage" = "https://github.com/shamsaraj/Chem_ML"
"Bug Tracker" = "https://github.com/shamsaraj/Chem_ML/issues"

