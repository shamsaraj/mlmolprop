[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlmolprop"
version = "1.0.0"
authors = [
  { name="Jamal Shamsara", email="jshamsara@yahoo.com" }
]
description = "Machine learning and cheminformatics toolkit for molecular modeling."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  # Lower bounds are the versions this was actually tested against
  # (see environment.yml); no upper bounds unless a real incompatibility
  # is found, so this doesn't fight other packages' version requirements.
  "numpy>=2.5",
  "pandas>=3.0",
  "matplotlib>=3.10",
  "scikit-learn>=1.9",
  "scipy>=1.18",
  "rdkit>=2025.9.3",
  "reportlab>=5.0",
  # reportlab doesn't pull in its own raster backend -- without this,
  # svg_files_to_png() and RDimage/moltosvg crash on a plain pip install
  # with "cannot import desired renderPM backend rlPyCairo".
  "rlPyCairo>=0.4.0",
  "svglib>=2.1",
  "lime>=0.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
# graphviz is imported only inside a try/except in model.py's decision-tree
# visualization path (already treated as optional by the code itself), and
# isn't in environment.yml, so there's no tested version to anchor a lower
# bound to.
viz = ["graphviz"]
# keras/tensorflow are used only by model.py's M="dl" path (lazy-imported
# there with an informative error if missing; nothing else in the package
# needs them). Kept separate from the torch extra since the two deep
# learning stacks are a large combined install and coexist badly in one
# environment more often than not -- most users of this package want the
# classical models and shouldn't have to pull in either.
dl = ["tensorflow>=2.16", "keras>=3.0"]
torch = ["torch>=2.0"]
all = ["mlmolprop[dl,torch]"]

[project.urls]
"Homepage" = "https://github.com/shamsaraj/mlmolprop"
"Bug Tracker" = "https://github.com/shamsaraj/mlmolprop/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mlmolprop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises heavier code paths (e.g. training a Keras model); still run by default, but filterable with `-m \"not slow\"`.",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Tests intentionally unpack full return tuples to document a function's
# return shape at the call site, even when a given test only asserts on
# part of it.
"tests/*" = ["RUF059"]
