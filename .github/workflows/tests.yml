name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets publish.yml gate a release on this exact suite instead of
  # duplicating it.
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: environment.yml
          activate-environment: mlmolprop
          miniforge-version: latest

      - name: Run test suite
        shell: bash -el {0}
        # Coverage floor is set at the level already achieved (93.8%), not an
        # aspiration -- it exists to catch a regression, not to force filler
        # tests. Raise it deliberately when real coverage improves.
        run: pytest -v --cov=mlmolprop --cov-report=term-missing --cov-fail-under=93

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: environment.yml
          activate-environment: mlmolprop
          miniforge-version: latest

      - name: Ruff check
        shell: bash -el {0}
        run: ruff check .

  pip-install-smoke-test:
    # Verifies the package installs from plain PyPI with no conda-forge
    # fallback, and that the base install (no extras) doesn't pull in
    # keras/torch -- catches a floor that only resolves via
    # conda-forge, or a dependency that should be optional but isn't.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: pip install .
        run: pip install .

      - name: Smoke test
        run: python -c "import mlmolprop; print(mlmolprop.__version__)"

  # Runs the suite against the oldest dependency set pyproject.toml claims to
  # support, so the declared floors stay a proven claim rather than drifting
  # back to whatever the dev environment happens to have. Keep these pins and
  # the floors in pyproject.toml in step: if one moves, move the other.
  pytest-oldest-supported:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install the oldest supported dependency set
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy==2.0.*" "pandas==2.2.*" "scikit-learn==1.5.*" \
            "scipy==1.13.*" "rdkit==2024.3.*" "matplotlib==3.9.*" \
            "reportlab" "svglib" "lime" "pytest" "keras" "torch" "xgboost"

      - name: Install mlmolprop without touching the pins
        # --no-deps keeps the pinned set intact; --ignore-requires-python lets
        # 3.11 be tested while pyproject still declares >=3.12.
        run: pip install --no-deps --ignore-requires-python .

      - name: Report the versions actually under test
        run: |
          python -c "import sys,numpy,pandas,sklearn,scipy,rdkit; print('python',sys.version.split()[0]); \
          print('numpy',numpy.__version__,'pandas',pandas.__version__,'sklearn',sklearn.__version__, \
          'scipy',scipy.__version__,'rdkit',rdkit.__version__)"

      - name: Run test suite
        env:
          KERAS_BACKEND: torch
        run: pytest -q
